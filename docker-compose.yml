services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.71.0
    user: "${UID:-1000}"
    command: 'start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode external'
    environment:
      # External domain configuration
      - ZITADEL_EXTERNALDOMAIN=${ZITADEL_EXTERNALDOMAIN}
      - ZITADEL_EXTERNALPORT=443
      - ZITADEL_EXTERNALSECURE=true
      - ZITADEL_TLS_ENABLED=false

      # Database configuration
      - ZITADEL_DATABASE_POSTGRES_HOST=db
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=${ZITADEL_DB_USER}
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=${ZITADEL_DB_PASSWORD}
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=${POSTGRES_USER}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=${POSTGRES_PASSWORD}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable

      # Login v2 configuration
      - ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH=/current-dir/login-client.pat
      - ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED=true
      - ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login
      - ZITADEL_OIDC_DEFAULTLOGINURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/login?authRequest=
      - ZITADEL_OIDC_DEFAULTLOGOUTURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/logout?post_logout_redirect=
      - ZITADEL_SAML_DEFAULTLOGINURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/login?samlRequest=
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME=login-client
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME=Automatically Initialized IAM_LOGIN_CLIENT
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE=2029-01-01T00:00:00Z

      # Instance setup
      - ZITADEL_FIRSTINSTANCE_ORG_NAME=Waugze
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=admin@waugze.com
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=${ZITADEL_ADMIN_PASSWORD}
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED=false
      - ZITADEL_FIRSTINSTANCE_PATPATH=/current-dir/admin.pat
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME=admin
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME=Automatically Initialized IAM_OWNER
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE=1

    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s

    volumes:
      - .:/current-dir:delegated

    networks:
      - traefik
      - zitadel

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.zitadel.loadbalancer.server.port=8080"
      - "traefik.http.services.zitadel.loadbalancer.server.scheme=h2c"
      - "traefik.http.services.zitadel.loadbalancer.passHostHeader=true"
      - "traefik.http.routers.zitadel-http.entrypoints=http"
      - "traefik.http.routers.zitadel-http.rule=Host(`${ZITADEL_EXTERNALDOMAIN}`)"
      - "traefik.http.routers.zitadel-http.middlewares=zitadel-redirect-to-https"
      - "traefik.http.routers.zitadel.entrypoints=https"
      - "traefik.http.routers.zitadel.rule=Host(`${ZITADEL_EXTERNALDOMAIN}`)"
      - "traefik.http.routers.zitadel.tls=true"
      - "traefik.http.routers.zitadel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zitadel.service=zitadel"
      - "traefik.http.middlewares.zitadel-redirect-to-https.redirectscheme.scheme=https"

  login:
    image: ghcr.io/zitadel/zitadel-login:latest
    user: "${UID:-1000}"
    restart: unless-stopped
    environment:
      - ZITADEL_API_URL=http://zitadel:8080
      - NEXT_PUBLIC_BASE_PATH=/ui/v2/login
      - ZITADEL_SERVICE_USER_TOKEN_FILE=/current-dir/login-client.pat

    volumes:
      - .:/current-dir:ro

    networks:
      - traefik
      - zitadel

    depends_on:
      zitadel:
        condition: service_healthy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zitadel-login-http.entrypoints=http"
      - "traefik.http.routers.zitadel-login-http.rule=Host(`${ZITADEL_EXTERNALDOMAIN}`) && (PathPrefix(`/ui/v2/login`) || PathPrefix(`/ui/v2/assets`))"
      - "traefik.http.routers.zitadel-login-http.middlewares=zitadel-redirect-to-https"
      - "traefik.http.routers.zitadel-login.entrypoints=https"
      - "traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_EXTERNALDOMAIN}`) && (PathPrefix(`/ui/v2/login`) || PathPrefix(`/ui/v2/assets`))"
      - "traefik.http.routers.zitadel-login.tls=true"
      - "traefik.http.routers.zitadel-login.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zitadel-login.service=zitadel-login"
      - "traefik.http.services.zitadel-login.loadbalancer.server.port=3000"
      - "traefik.http.services.zitadel-login.loadbalancer.server.scheme=http"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGUSER=${POSTGRES_USER}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s

    volumes:
      - zitadel_db_data:/var/lib/postgresql/data

    networks:
      - zitadel

networks:
  traefik:
    external: true
  zitadel:
    internal: true

volumes:
  zitadel_db_data:
    driver: local
